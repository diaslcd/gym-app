<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Frente do ícone adaptativo: só o coelho, sem fundo. O Android
       recorta a moldura, então o desenho fica dentro da área segura. -->
  <g transform="translate(256 256) scale(0.66) translate(-256 -256)">
    <g stroke="#12101A" stroke-width="20" stroke-linejoin="round">
      <!-- Orelhas atrás da cabeça, para o contorno ficar limpo. -->
      <ellipse cx="0" cy="0" rx="33" ry="94" fill="#FFFFFF" transform="translate(212 158) rotate(-14)"/>
      <ellipse cx="0" cy="0" rx="33" ry="94" fill="#FFFFFF" transform="translate(300 158) rotate(14)"/>
      <ellipse cx="0" cy="0" rx="14" ry="58" fill="#FF3D81" stroke-width="0" transform="translate(211 150) rotate(-14)"/>
      <ellipse cx="0" cy="0" rx="14" ry="58" fill="#FF3D81" stroke-width="0" transform="translate(301 150) rotate(14)"/>
  
      <ellipse cx="256" cy="300" rx="98" ry="86" fill="#FFFFFF"/>
    </g>
  
    <!-- Halter no lugar da gravata: é o que diz "academia" num relance.
         Contorno primeiro, cor por cima — assim as três peças viram uma só
         silhueta, sem as emendas que o traço deixaria entre elas. -->
    <g fill="#12101A" stroke="#12101A" stroke-width="20" stroke-linejoin="round">
      <rect x="206" y="415" width="100" height="22" rx="11"/>
      <rect x="176" y="396" width="36" height="60" rx="13"/>
      <rect x="300" y="396" width="36" height="60" rx="13"/>
    </g>
    <g fill="#FF3D81">
      <rect x="206" y="415" width="100" height="22" rx="11"/>
      <rect x="176" y="396" width="36" height="60" rx="13"/>
      <rect x="300" y="396" width="36" height="60" rx="13"/>
    </g>
  
    <!-- Rosto: cheio, sem contorno, para não embaralhar em 48px. -->
    <circle cx="222" cy="288" r="12" fill="#12101A"/>
    <circle cx="290" cy="288" r="12" fill="#12101A"/>
    <ellipse cx="256" cy="324" rx="16" ry="12" fill="#FF3D81"/>
  </g>
</svg>
