name: APK

# Gera o APK de teste sem precisar de Node, JDK ou Android SDK na máquina:
# o runner do GitHub já traz tudo. Rode pela aba Actions ("Run workflow"),
# ou marque uma versão com uma tag v* — o artefato sai com o número dela.
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  construir:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Instalar o Capacitor
        run: npm install

      # A versão vem do package.json, para o arquivo baixado já dizer qual é.
      - name: Ler a versão
        id: versao
        run: echo "v=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Montar a pasta www
        run: npm run www

      - name: Criar o projeto Android
        run: npx cap add android

      # O ícone do lançador não vem do manifest da web: o Android lê uma pilha
      # de PNGs em res/mipmap, montada aqui a partir das camadas do ícone.
      - name: Preparar as fontes do ícone
        run: |
          node -e "
            const fs = require('node:fs');
            // As camadas já saem em 1024 do workflow Imagens; aqui é só
            // renomear para o que o @capacitor/assets procura.
            const nomes = {
              'fonte-completo.png': 'icon-only.png',
              'fonte-frente.png': 'icon-foreground.png',
              'fonte-fundo.png': 'icon-background.png'
            };
            Object.keys(nomes).forEach((de) =>
              fs.copyFileSync('assets-android/' + de, 'assets-android/' + nomes[de]));
            console.log('fontes do ícone prontas');
          "

      - name: Gerar os ícones do Android
        run: npx @capacitor/assets generate --android --assetPath assets-android

      - name: Sincronizar os arquivos do app
        run: npx cap sync android

      # O runner começa limpo, e o Gradle cria um debug.keystore novo e
      # aleatório quando não encontra nenhum. Cada build saía assinado com
      # uma chave diferente, e o Android recusa atualizar um app cuja
      # assinatura mudou: toda versão exigia desinstalar a anterior, o que
      # apaga os dados. Com a chave fixa vinda do segredo, uma versão passa
      # por cima da outra e o histórico de treinos fica onde está.
      - name: Restaurar a chave de assinatura
        env:
          CHAVE: ${{ secrets.ANDROID_KEYSTORE }}
        run: |
          if [ -z "$CHAVE" ]; then
            echo "::error::falta o segredo ANDROID_KEYSTORE — o APK sairia com uma chave nova e não atualizaria a versão instalada"
            exit 1
          fi
          mkdir -p ~/.android
          echo "$CHAVE" | base64 -d > ~/.android/debug.keystore
          echo "chave restaurada em ~/.android/debug.keystore"
          # O Gradle troca a chave em silêncio quando não consegue lê-la:
          # o `validateSigningDebug` apaga o arquivo e gera outro. Listar
          # aqui mostra no log se o Java abriu o keystore e com qual
          # impressão digital — que é a mesma do APK quando dá certo.
          keytool -list -v -keystore ~/.android/debug.keystore \
            -storepass android -alias androiddebugkey \
            | grep -E "Alias|SHA256|Tipo|Type|Valid" || echo "AVISO: o Java nao conseguiu ler o keystore"

      - name: Compilar o APK de depuração
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Nomear o APK com a versão
        run: mv android/app/build/outputs/apk/debug/app-debug.apk bunnygym-${{ steps.versao.outputs.v }}.apk

      - name: Publicar o APK
        uses: actions/upload-artifact@v4
        with:
          name: bunnygym-${{ steps.versao.outputs.v }}
          path: bunnygym-${{ steps.versao.outputs.v }}.apk
          if-no-files-found: error
