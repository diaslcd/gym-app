name: APK

# Gera o APK de teste sem precisar de Node, JDK ou Android SDK na máquina:
# o runner do GitHub já traz tudo. Rode pela aba Actions ("Run workflow"),
# ou marque uma versão com uma tag v* — o artefato sai com o número dela.
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  construir:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Instalar o Capacitor
        run: npm install

      # A versão vem do package.json, para o arquivo baixado já dizer qual é.
      - name: Ler a versão
        id: versao
        run: echo "v=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Montar a pasta www
        run: npm run www

      - name: Criar o projeto Android
        run: npx cap add android

      # O ícone do lançador não vem do manifest da web: o Android lê uma pilha
      # de PNGs em res/mipmap, montada aqui a partir das camadas do ícone.
      - name: Preparar as fontes do ícone
        run: |
          npm install --no-save sharp
          node -e "
            const sharp = require('sharp');
            const fs = require('node:fs');
            // As camadas do ícone adaptativo vêm em 432px, o tamanho que o
            // lançador usa na maior densidade; o @capacitor/assets pede 1024.
            const ampliar = (de, para) =>
              sharp('assets-android/' + de).resize(1024, 1024).png().toFile('assets-android/' + para);
            fs.copyFileSync('assets-android/fonte-completo.png', 'assets-android/icon-only.png');
            Promise.all([
              ampliar('fonte-frente.png', 'icon-foreground.png'),
              ampliar('fonte-fundo.png', 'icon-background.png')
            ]).then(() => console.log('fontes do ícone prontas'));
          "

      - name: Gerar os ícones do Android
        run: npx @capacitor/assets generate --android --assetPath assets-android

      - name: Sincronizar os arquivos do app
        run: npx cap sync android

      - name: Compilar o APK de depuração
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Nomear o APK com a versão
        run: mv android/app/build/outputs/apk/debug/app-debug.apk bunnygym-${{ steps.versao.outputs.v }}.apk

      - name: Publicar o APK
        uses: actions/upload-artifact@v4
        with:
          name: bunnygym-${{ steps.versao.outputs.v }}
          path: bunnygym-${{ steps.versao.outputs.v }}.apk
          if-no-files-found: error
