name: APK

# Gera o APK de teste sem precisar de Node, JDK ou Android SDK na máquina:
# o runner do GitHub já traz tudo. Rode pela aba Actions ("Run workflow")
# e baixe o arquivo em "Artifacts", no fim da execução.
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  construir:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Instalar o Capacitor
        run: npm install

      - name: Montar a pasta www
        run: npm run www

      - name: Criar o projeto Android
        run: npx cap add android

      - name: Sincronizar os arquivos do app
        run: npx cap sync android

      - name: Compilar o APK de depuração
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Publicar o APK
        uses: actions/upload-artifact@v4
        with:
          name: gym-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
