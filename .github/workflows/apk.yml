name: APK

# Gera o APK de teste sem precisar de Node, JDK ou Android SDK na máquina:
# o runner do GitHub já traz tudo. Rode pela aba Actions ("Run workflow"),
# ou marque uma versão com uma tag v* — o artefato sai com o número dela.
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  construir:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Instalar o Capacitor
        run: npm install

      # A versão vem do package.json, para o arquivo baixado já dizer qual é.
      - name: Ler a versão
        id: versao
        run: echo "v=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Montar a pasta www
        run: npm run www

      - name: Criar o projeto Android
        run: npx cap add android

      # O ícone do lançador do Android não vem do manifest da web: é uma
      # pilha de PNGs em res/mipmap. Estes passos desenham essa pilha a
      # partir do mesmo SVG do coelho, para não haver dois ícones no
      # projeto podendo divergir.
      - name: Rasterizar o ícone
        run: |
          npm install --no-save sharp
          node -e "
            const sharp = require('sharp');
            const svg = (arquivo) => sharp(arquivo, { density: 600 }).resize(1024, 1024);
            Promise.all([
              svg('assets-android/icone-completo.svg').png().toFile('assets-android/icon-only.png'),
              svg('assets-android/icone-frente.svg').png().toFile('assets-android/icon-foreground.png'),
              sharp({ create: { width: 1024, height: 1024, channels: 4,
                                background: '#FFD23F' } }).png().toFile('assets-android/icon-background.png')
            ]).then(() => console.log('PNGs do ícone prontos'));
          "

      - name: Gerar os ícones do Android
        run: npx @capacitor/assets generate --android --assetPath assets-android

      - name: Sincronizar os arquivos do app
        run: npx cap sync android

      - name: Compilar o APK de depuração
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Nomear o APK com a versão
        run: mv android/app/build/outputs/apk/debug/app-debug.apk bunnygym-${{ steps.versao.outputs.v }}.apk

      - name: Publicar o APK
        uses: actions/upload-artifact@v4
        with:
          name: bunnygym-${{ steps.versao.outputs.v }}
          path: bunnygym-${{ steps.versao.outputs.v }}.apk
          if-no-files-found: error
