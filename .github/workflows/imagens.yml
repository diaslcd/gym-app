name: Imagens

# Deriva do que está em arte-fonte/ tudo que o app serve: os recortes dos
# treinos e as camadas do ícone. Sai como artefato para ser conferido antes
# de entrar no repositório — os originais não vão para dentro do app.
on:
  workflow_dispatch:

jobs:
  gerar:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Recortar os treinos
        run: |
          npm install --no-save sharp
          mkdir -p saida
          node -e "
            const sharp = require('sharp');
            // Recorte quadrado sobre a figura, em coordenadas do render 688x1529.
            const corte = { left: 165, top: 512, width: 358, height: 358 };
            const arquivos = ['peito-triceps', 'costas-biceps', 'perna', 'superiores'];
            Promise.all(arquivos.map((nome) =>
              sharp('arte-fonte/' + nome + '.jpg')
                .extract(corte)
                .resize(224, 224)
                .webp({ quality: 82 })
                .toFile('saida/' + nome + '.webp')
                .then((info) => console.log(nome + ': ' + Math.round(info.size / 1024) + ' KB'))
            ));
          "

      # O ícone chega como um PNG chapado. O Android quer duas camadas que
      # ele compõe sozinho, então elas saem daqui: o fundo é o degradê
      # refeito a partir das cores das pontas do original (sem a marca, que
      # senão apareceria duas vezes), e a frente é só a marca branca,
      # recortada por limiar depois de achatar os cantos transparentes.
      - name: Montar as camadas do ícone
        run: |
          node -e "
            const sharp = require('sharp');
            const fonte = 'arte-fonte/icone-bunnygym.png';
            const L = 1024;
            const MARCA = Math.round(L * 0.62); // folga que o recorte do lançador come
            const margem = Math.round((L - MARCA) / 2);

            const corEm = (x, y) => sharp(fonte)
              .extract({ left: x, top: y, width: 16, height: 16 })
              .stats()
              .then((s) => 'rgb(' + s.channels.slice(0, 3).map((c) => Math.round(c.mean)).join(',') + ')');

            Promise.all([corEm(160, 160), corEm(848, 848)]).then(([claro, escuro]) => {
              const degrade = Buffer.from(
                '<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"' + L + '\" height=\"' + L + '\">' +
                '<defs><linearGradient id=\"g\" x1=\"0\" y1=\"0\" x2=\"1\" y2=\"1\">' +
                '<stop offset=\"0\" stop-color=\"' + claro + '\"/>' +
                '<stop offset=\"1\" stop-color=\"' + escuro + '\"/>' +
                '</linearGradient></defs><rect width=\"' + L + '\" height=\"' + L + '\" fill=\"url(#g)\"/></svg>'
              );
              console.log('degradê de ' + claro + ' a ' + escuro);

              // Só o miolo entra no limiar. Os cantos do original são
              // brancos, não transparentes, e virariam quina opaca na marca.
              const M = Math.round(L * 0.7);
              const inicio = Math.round(L * 0.15);

              const frente = sharp(fonte).resize(L, L)
                .extract({ left: inicio, top: inicio, width: M, height: M })
                .greyscale().threshold(190).raw().toBuffer()
                .then((mascara) =>
                  sharp({ create: { width: M, height: M, channels: 3, background: '#ffffff' } })
                    .joinChannel(mascara, { raw: { width: M, height: M, channels: 1 } })
                    .png().toBuffer()
                )
                .then((marca) => sharp(marca).trim().png().toBuffer())
                .then((cortada) =>
                  sharp(cortada).resize(MARCA, MARCA, {
                    fit: 'contain',
                    background: { r: 0, g: 0, b: 0, alpha: 0 }
                  }).png().toBuffer()
                )
                .then((ajustada) =>
                  sharp({ create: { width: L, height: L, channels: 4, background: { r: 0, g: 0, b: 0, alpha: 0 } } })
                    .composite([{ input: ajustada, top: margem, left: margem }])
                    .png().toFile('saida/fonte-frente.png')
                );

              return Promise.all([
                sharp(fonte).resize(L, L).png().toFile('saida/fonte-completo.png'),
                sharp(degrade).png().toFile('saida/fonte-fundo.png'),
                frente,
                sharp(fonte).resize(512, 512).png().toFile('saida/icone.png')
              ]);
            }).then(() => Promise.all([
              sharp('saida/fonte-fundo.png').resize(512, 512).toBuffer(),
              sharp('saida/fonte-frente.png').resize(512, 512).toBuffer()
            ])).then(([fundo512, frente512]) =>
              sharp(fundo512).composite([{ input: frente512 }])
                .png().toFile('saida/icone-mascara.png')
            ).then(() => console.log('camadas do ícone prontas'));
          "

      - name: Publicar o resultado
        uses: actions/upload-artifact@v4
        with:
          name: imagens
          path: saida/*
          if-no-files-found: error
