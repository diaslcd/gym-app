name: Imagens

# Deriva do que está em arte-fonte/ tudo que o app serve: os recortes dos
# treinos e as camadas do ícone. Sai como artefato para ser conferido antes
# de entrar no repositório — os originais não vão para dentro do app.
on:
  workflow_dispatch:

jobs:
  gerar:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Recortar os treinos
        run: |
          npm install --no-save sharp
          mkdir -p saida
          node -e "
            const sharp = require('sharp');
            // Recorte quadrado sobre a figura, em coordenadas do render 688x1529.
            const corte = { left: 165, top: 512, width: 358, height: 358 };
            const arquivos = ['peito-triceps', 'costas-biceps', 'perna', 'superiores'];
            Promise.all(arquivos.map((nome) =>
              sharp('arte-fonte/' + nome + '.jpg')
                .extract(corte)
                .resize(224, 224)
                .webp({ quality: 82 })
                .toFile('saida/' + nome + '.webp')
                .then((info) => console.log(nome + ': ' + Math.round(info.size / 1024) + ' KB'))
            ));
          "

      # Do arquivo original só a marca branca é aproveitada — a cor vem da
      # paleta do app. O Android quer fundo e frente separados, e a versão
      # cheia é a mesma composição num quadrado de cantos arredondados.
      - name: Montar as camadas do ícone
        run: |
          node -e "
            const sharp = require('sharp');
            const fonte = 'arte-fonte/icone-bunnygym.png';
            const L = 1024;
            const MARCA = Math.round(L * 0.62); // folga que o recorte do lançador come
            const margem = Math.round((L - MARCA) / 2);
            const claro = '#9B5CFF';   // roxo dos cards
            const escuro = '#5B21B6';  // roxo escuro, para o degradê ter profundidade

            const degrade = (extra) =>
              '<defs><linearGradient id=\"g\" x1=\"0\" y1=\"0\" x2=\"1\" y2=\"1\">' +
              '<stop offset=\"0\" stop-color=\"' + claro + '\"/>' +
              '<stop offset=\"1\" stop-color=\"' + escuro + '\"/></linearGradient></defs>' +
              '<rect width=\"' + L + '\" height=\"' + L + '\" ' + extra + ' fill=\"url(#g)\"/>';

            const svg = (conteudo) => Buffer.from(
              '<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"' + L + '\" height=\"' + L + '\">' +
              conteudo + '</svg>'
            );

            // Só o miolo entra no limiar: os cantos do arquivo original são
            // brancos, não transparentes, e virariam quina opaca na marca.
            const M = Math.round(L * 0.7);
            const inicio = Math.round(L * 0.15);

            const frente = sharp(fonte).resize(L, L)
              .extract({ left: inicio, top: inicio, width: M, height: M })
              .greyscale().threshold(190).raw().toBuffer()
              .then((mascara) =>
                sharp({ create: { width: M, height: M, channels: 3, background: '#ffffff' } })
                  .joinChannel(mascara, { raw: { width: M, height: M, channels: 1 } })
                  .png().toBuffer()
              )
              // Recorta no próprio contorno: o original tem folga de sobra,
              // e sem isso a marca encolheria junto com ela.
              .then((marca) => sharp(marca).trim().png().toBuffer())
              .then((cortada) =>
                sharp(cortada).resize(MARCA, MARCA, {
                  fit: 'contain',
                  background: { r: 0, g: 0, b: 0, alpha: 0 }
                }).png().toBuffer()
              )
              .then((ajustada) =>
                sharp({ create: { width: L, height: L, channels: 4, background: { r: 0, g: 0, b: 0, alpha: 0 } } })
                  .composite([{ input: ajustada, top: margem, left: margem }])
                  .png().toBuffer()
              );

            frente.then((camadaFrente) => Promise.all([
              sharp(camadaFrente).toFile('saida/fonte-frente.png'),
              sharp(svg(degrade(''))).png().toFile('saida/fonte-fundo.png'),

              // Cheio: degradê com cantos arredondados e a marca por cima.
              sharp(svg(degrade('rx=\"' + Math.round(L * 0.22) + '\"')))
                .composite([{ input: camadaFrente }]).png().toBuffer()
                .then((cheio) => Promise.all([
                  sharp(cheio).toFile('saida/fonte-completo.png'),
                  sharp(cheio).resize(512, 512).toFile('saida/icone.png')
                ])),

              // Mascarável: o mesmo composto, mas sem cantos — quem recorta é o
              // sistema. Compõe primeiro e reduz depois: o sharp aplica o
              // resize antes do composite, e a marca não caberia na base menor.
              sharp(svg(degrade('')))
                .composite([{ input: camadaFrente }]).png().toBuffer()
                .then((mascara) => sharp(mascara).resize(512, 512).toFile('saida/icone-mascara.png'))
            ])).then(() => console.log('camadas do ícone prontas'));
          "

      - name: Publicar o resultado
        uses: actions/upload-artifact@v4
        with:
          name: imagens
          path: saida/*
          if-no-files-found: error
