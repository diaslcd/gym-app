<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Placa amarela do app, com a borda grossa do estilo arcade. -->
  <rect width="512" height="512" rx="112" fill="#FFD23F"/>
  <rect x="18" y="18" width="476" height="476" rx="96" fill="none" stroke="#12101A" stroke-width="30"/>

  <g stroke="#12101A" stroke-width="20" stroke-linejoin="round">
    <!-- Orelhas atrás da cabeça, para o contorno ficar limpo. -->
    <ellipse cx="0" cy="0" rx="33" ry="94" fill="#FFFFFF" transform="translate(212 170) rotate(-14)"/>
    <ellipse cx="0" cy="0" rx="33" ry="94" fill="#FFFFFF" transform="translate(300 170) rotate(14)"/>
    <ellipse cx="0" cy="0" rx="14" ry="58" fill="#FF3D81" stroke-width="0" transform="translate(211 162) rotate(-14)"/>
    <ellipse cx="0" cy="0" rx="14" ry="58" fill="#FF3D81" stroke-width="0" transform="translate(301 162) rotate(14)"/>

    <ellipse cx="256" cy="312" rx="98" ry="86" fill="#FFFFFF"/>

    <!-- Halter no lugar da gravata: é o que diz "academia" num relance. -->
    <rect x="206" y="410" width="100" height="20" rx="10" fill="#FF3D81"/>
    <rect x="176" y="392" width="34" height="56" rx="12" fill="#FF3D81"/>
    <rect x="302" y="392" width="34" height="56" rx="12" fill="#FF3D81"/>
  </g>

  <!-- Rosto: cheio, sem contorno, para não embaralhar em 48px. -->
  <circle cx="222" cy="300" r="12" fill="#12101A"/>
  <circle cx="290" cy="300" r="12" fill="#12101A"/>
  <ellipse cx="256" cy="336" rx="16" ry="12" fill="#FF3D81"/>
</svg>
